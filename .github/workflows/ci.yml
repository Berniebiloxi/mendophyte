name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
        exclude:
          # one Windows leg is enough; the pty test is skipped there anyway
          - os: windows-latest
            node: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Same path a fresh clone takes: install builds the server and web app via `prepare`.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Built artefacts exist
        shell: bash
        run: test -f dist/cli.js && test -f public/index.html && test -f prompts/00-entry.md

  browser:
    name: browser walkthrough · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Drives the built app in the runner's own Chrome and saves screenshots
      # from each platform, so Windows and Linux renders can be compared.
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: test/browser/shots/
          if-no-files-found: ignore
